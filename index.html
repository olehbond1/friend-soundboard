<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Поштурхай друга</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1 class="title">Поштурхай друга</h1>

  <div class="grid">

    <div class="cell">
      <div class="speech-bubble" id="bubble1"></div>

           onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%232a2a2a%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23888%22 font-size=%2228%22 font-family=%22sans-serif%22 text-anchor=%22middle%22 dy=%22.3em%22>photo1.jpeg</text></svg>'">
      <button class="bang-btn" data-target="photo1">БАБАХ</button>
    </div>

    <div class="cell">
      <div class="speech-bubble" id="bubble2"></div>
      <img src="photo2.jpeg" alt="Друг 2" class="photo" id="photo2"
           onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%232a2a2a%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23888%22 font-size=%2228%22 font-family=%22sans-serif%22 text-anchor=%22middle%22 dy=%22.3em%22>photo2.jpeg</text></svg>'">
      <button class="bang-btn" data-target="photo2">БАБАХ</button>
    </div>

    <div class="cell">
      <div class="speech-bubble" id="bubble3"></div>
      <img src="photo3.jpeg" alt="Друг 3" class="photo" id="photo3"
           onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%232a2a2a%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23888%22 font-size=%2228%22 font-family=%22sans-serif%22 text-anchor=%22middle%22 dy=%22.3em%22>photo3.jpeg</text></svg>'">
      <button class="bang-btn" data-target="photo3">БАБАХ</button>

      <button class="bang-btn" data-target="photo4">БАБАХ</button>
    </div>

  </div>

  <script src="script.js"></script>

</html>
